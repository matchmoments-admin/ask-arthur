# Cloudflare Worker: AskArthur intel-inbound-email router.
#
# Receives email via Cloudflare Email Routing, parses, POSTs to the
# intel-inbound-email Supabase Edge Function.
#
# Operational setup (one-time):
#   1. Enable Email Routing on the askarthur.au zone in Cloudflare dashboard.
#   2. Create a "Catch-all" rule pointing at this Worker.
#   3. Or create per-tag rules: acsc+ingest@..., scamwatch+ingest@..., etc.
#   4. wrangler secret put INBOUND_EMAIL_WEBHOOK_SECRET
#   5. wrangler secret put SUPABASE_EDGE_FUNCTION_URL
#   6. Verify the quarantine inbox as an Email Routing destination address,
#      then set QUARANTINE_ADDRESS under [vars] below.
#   7. wrangler deploy

name = "askarthur-intel-inbound-email"
# Keep plain-text vars set in the Cloudflare dashboard (e.g. QUARANTINE_ADDRESS)
# across `wrangler deploy` — without this, declaring [vars] here makes every
# deploy overwrite them and quarantine would silently fall back to dropping mail.
keep_vars = true
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Quarantine: messages the Worker cannot deliver (MIME parse failure, missing
# scan endpoint, fetch error, 5xx from the target) are forwarded with
# `message.forward(QUARANTINE_ADDRESS)` for manual replay. The address MUST be
# a VERIFIED destination address in Cloudflare Email Routing (dashboard →
# Email → Email Routing → Destination addresses) — forward() rejects any other
# address, and the Worker logs that failure. Unset → the Worker logs loudly
# and the message is dropped. (Replaces the old [[send_email]]
# QUARANTINE_FORWARDER binding, whose send() could not carry an inbound
# message and whose failures were swallowed.)
[vars]
# QUARANTINE_ADDRESS = "ops@askarthur.au"

[observability]
enabled = true
