name: Promptfoo regression eval

# Round-2 audit (i) closure (skeleton). Runs the analyze-prompt
# regression suite against real Haiku when:
#   - PR touches files under evals/ (new fixture or config change)
#   - PR touches packages/scam-engine/src/claude.ts (prompt change)
#   - PR touches packages/types/src/analysis.ts (PROMPT_VERSION bump)
#   - manually via workflow_dispatch
#
# Each run hits real Anthropic Haiku — typically $0.02-$0.05 per run
# at 4 fixtures. The path-filter keeps the bill bounded.
#
# Job runs only on pull_request (not push) so it never gates main.
# Failure surfaces in the PR check list; squash-merge will not
# auto-skip it because the path-filter already governs invocation.
#
# HISTORY (2026-07-30): this workflow was green 24 times out of 24 and had never
# run an eval. `ANTHROPIC_API_KEY_EVAL` was never added, and the missing-key
# branch was `exit 0`, so every run took it and reported success — USD $0 spent
# across 86 days. Because the path filter targets exactly claude.ts and
# PROMPT_VERSION, a change degrading SAFE/SUSPICIOUS/HIGH_RISK classification
# would ship with a green "Promptfoo regression eval" beside it.
#
# The branch is now `exit 1`. The workflow will FAIL on any matching PR until the
# secret is added — that is the intended state: a control that cannot run has not
# passed. Once the secret lands, verify it can actually go red by pushing a
# deliberate prompt regression to a scratch branch. A check that has never failed
# has never been tested.
#
# MADE REAL (2026-08-07, Tier 2 item 7): ANTHROPIC_API_KEY_EVAL set (interim:
# shares the platform key; rotate to a dedicated eval key at leisure). The
# first-ever execution surfaced three defect layers the exit-0 era had hidden:
# config file:// paths resolving config-relative (evals/evals/ ENOENT), the
# provider needing a default-exported CLASS not a function, and promptfoo's
# split assertion semantics (single-line = expression, multi-line = function
# body needing `return` — comment-led bodies silently returned undefined).
# After fixes: 4/4 fixtures pass with correct verdicts (no prompt drift found
# across the uncovered 86 days), and the go-red test — a deliberate
# impossible assertion on a scratch branch — produced a genuine failure
# (run 31140822180). Both directions of the control are now tested.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "evals/**"
      - "packages/scam-engine/src/claude.ts"
      - "packages/types/src/analysis.ts"
  workflow_dispatch:

concurrency:
  group: promptfoo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run promptfoo eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_EVAL }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY_EVAL is not set, so no eval ran."
            echo "::error::Add the secret in repo settings. A control that cannot run has not passed."
            exit 1
          fi
          pnpm dlx promptfoo@latest eval \
            --config evals/promptfooconfig.yaml \
            --output evals/output.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-output
          path: evals/output.json
          # `error`, not the default `warn`: a missing output.json means the eval
          # did not produce results, and this step is the last thing that could
          # notice. Warning here is how the job stayed green 24/24 times.
          if-no-files-found: error
          retention-days: 14
