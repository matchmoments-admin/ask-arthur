name: Clone Watch → LinkedIn (monthly)

# Recurring "Australian Clone Watch" LinkedIn post — design in
# docs/ops/clone-watch-linkedin-automation.md.
#
#   prepare  → renders the 7-slide carousel PDF against PROD + generates the
#              deterministic caption (numbers reconcile to the digest) + pings
#              Telegram with the run link and the caption for review.
#   publish  → GATED behind the `clone-watch-linkedin` Environment (required
#              reviewer = the founder). On approval, publishes to the Ask Arthur
#              company page and confirms with the post URL + the first comment to
#              paste (LinkedIn Dev-Tier can't post comments) + a reshare nudge.
#
# Dry run passed 2026-07-05 (render→caption→artifact→Telegram all green, approval
# gate paused correctly). Cron ENABLED — first auto-post is the July edition
# (~Aug 2). Every run still requires founder approval before publishing.

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Report month YYYY-MM (blank = prior calendar month)"
        required: false
        type: string
      note:
        description: >-
          Optional editorial note, published verbatim in the post immediately
          after the month-on-month sentence. Use it for RESTATEMENTS — if a
          method change moved a previously published month, the post must say
          so, because the series sentence quotes that month's total.
        required: false
        type: string
  schedule:
    - cron: "0 1 2 * *" # 2nd of month 01:00 UTC (~11:00 AEST), after the summary snapshot cron

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      month: ${{ steps.month.outputs.value }}
      title: ${{ steps.caption.outputs.title }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve report month
        id: month
        env:
          MONTH_INPUT: ${{ inputs.month }}
        run: |
          if [ -n "$MONTH_INPUT" ]; then
            M="$MONTH_INPUT"
          else
            # first-of-this-month minus one day → last day of the prior month.
            M=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          fi
          echo "value=$M" >> "$GITHUB_OUTPUT"
          echo "Report month: $M"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Puppeteer
        run: pnpm --filter @askarthur/web exec puppeteer browsers install chrome

      # Compute the card ONCE and pin it (v298 card_json + out/card.json).
      #
      # Everything downstream — the eight slides, the caption, and the
      # post-approval publish write-back — then quotes these exact numbers.
      # They used to be three-to-five INDEPENDENT reads of shopfront_clone_alerts,
      # whose lifecycle columns the reconciler mutates daily and which every KPI
      # on slide 06 reads: the export built the card once per slide inside the
      # prod Next server, the caption rebuilt it here minutes later, and the
      # write-back rebuilt it a third time AFTER the approval gate below —
      # which is unbounded. The PDF that got approved and the row persisted
      # afterwards were computed from different snapshots.
      #
      # MUST run before the export, which reads the pin.
      - name: Compute + pin the report card
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MONTH: ${{ steps.month.outputs.value }}
          NOTE: ${{ inputs.note }}
        run: |
          # The note is pinned into card_json here, NOT applied later: this step
          # recomputes the card, so anything set on the row beforehand would be
          # overwritten by it.
          if [ -n "$NOTE" ]; then
            pnpm clone-watch:compute-card -- --month="$MONTH" --out=out --note="$NOTE"
          else
            pnpm clone-watch:compute-card -- --month="$MONTH" --out=out
          fi

      - name: Render carousel PDF (against prod)
        working-directory: apps/web
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          MONTH: ${{ steps.month.outputs.value }}
        run: pnpm report-card:export -- --base=https://askarthur.au --month="$MONTH" --out=out

      - name: Generate caption
        id: caption
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MONTH: ${{ steps.month.outputs.value }}
        run: |
          pnpm clone-watch:caption -- --month="$MONTH" --out=out
          echo "title=$(cat out/title.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload edition artifact
        uses: actions/upload-artifact@v4
        with:
          name: clone-watch-edition
          path: apps/web/out
          retention-days: 14

      # Send the ACTUAL SLIDES before the approval gate. Until now the review
      # ping carried only a caption preview and the carousel existed solely as
      # a GitHub artifact you had to download and unzip — so the founder was
      # approving a public post without ever seeing the images (their words,
      # 2026-08-09: "I couldn't see that the images matched"). The export step
      # already writes slide-N.png, so this just puts them on the phone.
      - name: Telegram — slide preview
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TITLE: ${{ steps.caption.outputs.title }}
        working-directory: apps/web
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ADMIN_CHAT_ID" ]; then
            echo "Telegram not configured — skipping slide preview"; exit 0
          fi
          SLIDES=$(ls out/slide-*.png 2>/dev/null | sort -V)
          if [ -z "$SLIDES" ]; then
            echo "no slide PNGs found — skipping preview (PDF still in the artifact)"; exit 0
          fi
          # sendMediaGroup takes up to 10 items; the deck is 7. The caption on
          # the first item labels the album in the chat.
          ARGS=""
          MEDIA="["
          i=0
          for f in $SLIDES; do
            i=$((i+1))
            ARGS="$ARGS -F file$i=@$f"
            if [ "$i" -gt 1 ]; then MEDIA="$MEDIA,"; fi
            if [ "$i" -eq 1 ]; then
              MEDIA="$MEDIA{\"type\":\"photo\",\"media\":\"attach://file$i\",\"caption\":\"$TITLE — slides for review\"}"
            else
              MEDIA="$MEDIA{\"type\":\"photo\",\"media\":\"attach://file$i\"}"
            fi
          done
          MEDIA="$MEDIA]"
          # shellcheck disable=SC2086
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMediaGroup" \
            -F "chat_id=$TELEGRAM_ADMIN_CHAT_ID" -F "media=$MEDIA" $ARGS \
            -o /tmp/tg-media.json -w 'slide preview HTTP %{http_code}\n' || true
          grep -q '"ok":true' /tmp/tg-media.json || echo "⚠ slide preview failed: $(head -c 300 /tmp/tg-media.json)"
          # The bound PDF too — it is exactly what gets posted.
          PDF=$(ls out/*.pdf 2>/dev/null | head -1)
          if [ -n "$PDF" ]; then
            curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendDocument" \
              -F "chat_id=$TELEGRAM_ADMIN_CHAT_ID" -F "document=@$PDF" \
              -F "caption=The exact PDF that will be posted" \
              -o /dev/null -w 'pdf HTTP %{http_code}\n' || true
          fi

      - name: Telegram — ready for review
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: ${{ steps.caption.outputs.title }}
        working-directory: apps/web
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ADMIN_CHAT_ID" ]; then
            echo "Telegram not configured — skipping ping"; exit 0
          fi
          PREVIEW=$(head -c 900 out/caption.txt)
          TEXT=$(printf '🕵️ *%s* is ready for review.\n\n👆 The slides above are exactly what will be posted — check them first.\n\nApprove the publish here → %s\n\nCaption preview:\n%s' "$TITLE" "$RUN_URL" "$PREVIEW")
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_ADMIN_CHAT_ID" \
            --data-urlencode "text=$TEXT" \
            --data-urlencode "parse_mode=Markdown" >/dev/null

      # A RED SCHEDULED PREPARE USED TO PAGE NOBODY.
      #
      # `publish` has had a failure ping since it shipped, because a publish
      # failure happens after founder approval and risks a double-post on
      # re-run. `prepare` had none — and prepare is the half that runs
      # UNATTENDED on the 2nd of the month. So on 2026-09-02 the export's
      # height guard correctly refused a clipping slide 7, the run went red,
      # and nothing said so: the August edition was simply never published, and
      # the failure was found two days later only by running the lane by hand.
      #
      # Degradation must not be indistinguishable from health. There is no
      # `exit 0` swallow above this — the export/caption steps fail the job on
      # error, which is what makes `if: failure()` reachable here.
      - name: Telegram — prepare failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MONTH: ${{ steps.month.outputs.value }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ADMIN_CHAT_ID" ]; then exit 0; fi
          TEXT=$(printf '⚠️ Clone Watch PREPARE failed for %s — no carousel was built, so the edition will NOT publish until this is fixed. Nothing was posted and nothing is awaiting approval: %s' "$MONTH" "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_ADMIN_CHAT_ID" \
            --data-urlencode "text=$TEXT" >/dev/null

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    # The approval gate: this Environment must have a required reviewer (the
    # founder). The job pauses here until approved in the GitHub Actions UI.
    environment: clone-watch-linkedin
    steps:
      # THE POSTING WINDOW. Approval says "this edition is good"; it does not
      # say "post it right now". The founder cannot post during weekday
      # business hours, so an approval given at 11:00 must not go out at 11:00.
      #
      # Weekdays 17:00–23:59 Australia/Sydney, or any time at the weekend.
      # Sydney rather than UTC because the constraint is a human working day,
      # and via TZ (not a fixed offset) so AEST/AEDT is handled for us — GitHub
      # cron is UTC-only and does not observe DST, which is exactly the trap
      # that would post an hour early for half the year.
      #
      # Fails rather than waits: a sleep-until-17:00 job bills for the whole
      # hold and dies at the 6h cap if approved before ~11:00. Re-running after
      # the window opens is safe — the publish step below refuses to double-post
      # when an URN is already recorded for the month.
      - name: Enforce the posting window
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MONTH: ${{ needs.prepare.outputs.month }}
        run: |
          HOUR=$(TZ=Australia/Sydney date +%-H)
          DOW=$(TZ=Australia/Sydney date +%u)   # 1=Mon … 6=Sat, 7=Sun
          NOW=$(TZ=Australia/Sydney date '+%a %H:%M %Z')
          if [ "$DOW" -ge 6 ] || [ "$HOUR" -ge 17 ]; then
            echo "Posting window OPEN ($NOW) — continuing."
            exit 0
          fi
          echo "Posting window CLOSED ($NOW). Weekdays before 17:00 do not post."
          # Suppress the generic post-approval failure ping below, whose message
          # ("a re-run may double-post") is wrong and alarming for this case.
          echo "WINDOW_BLOCKED=true" >> "$GITHUB_ENV"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_ADMIN_CHAT_ID" ]; then
            TEXT=$(printf '\xe2\x8f\xb8 Clone Watch %s was approved at %s — OUTSIDE the posting window, so NOTHING was posted. The carousel is built and waiting. Re-run the publish job after 17:00 on a weekday, or any time at the weekend: %s' "$MONTH" "$NOW" "$RUN_URL")
            curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_ADMIN_CHAT_ID" \
              --data-urlencode "text=$TEXT" >/dev/null || true
          fi
          exit 1

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Download edition artifact
        uses: actions/download-artifact@v4
        with:
          name: clone-watch-edition
          path: apps/web/out

      - name: Publish to LinkedIn (guarded — company page)
        id: publish
        working-directory: apps/web
        env:
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_URN: ${{ secrets.LINKEDIN_ORG_URN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MONTH: ${{ needs.prepare.outputs.month }}
          TITLE: ${{ needs.prepare.outputs.title }}
        run: |
          set -o pipefail
          # clone-watch:publish self-guards: it SKIPS (green) if this month already
          # has a recorded post URN, and records the URN after a successful post —
          # so this step is safe to re-run and can't double-post.
          pnpm clone-watch:publish -- \
            --pdf="out/clone-watch-$MONTH.pdf" \
            --caption-file=out/caption.txt \
            --comment="$(cat out/first-comment.txt)" \
            --title="$TITLE" \
            --month="$MONTH" | tee publish.log
          # `|| true` so a parse miss can't red the step after a live post.
          echo "result=$(grep -m1 -oE 'RESULT=[a-z]+' publish.log | cut -d= -f2 || true)" >> "$GITHUB_OUTPUT"
          echo "url=$(grep -m1 -oE 'URL=[^[:space:]]+' publish.log | cut -d= -f2 || true)" >> "$GITHUB_OUTPUT"
          # Post-publish verification marker (see clone-watch-publish.ts):
          # ok = every API-observable field checked out. NOT a proof of member
          # visibility — see the note in the Telegram message below.
          echo "verify=$(grep -m1 -oE 'VERIFY=[a-z]+' publish.log | cut -d= -f2 || true)" >> "$GITHUB_OUTPUT"

      - name: Telegram — published + manual steps
        if: always() && steps.publish.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          POST_URL: ${{ steps.publish.outputs.url }}
          RESULT: ${{ steps.publish.outputs.result }}
          VERIFY: ${{ steps.publish.outputs.verify }}
          MONTH: ${{ needs.prepare.outputs.month }}
        working-directory: apps/web
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ADMIN_CHAT_ID" ]; then
            echo "Telegram not configured — skipping ping"; exit 0
          fi
          if [ "$RESULT" = "skipped" ]; then
            TEXT=$(printf '⏭ Clone Watch: %s was already posted (%s) — skipped, no double-post.' "$MONTH" "$POST_URL")
          else
            COMMENT=$(cat out/first-comment.txt)
            if [ "$VERIFY" = "ok" ]; then
              VLINE='API checks passed (published/public/main-feed, document available, listed on the page).'
            else
              VLINE='⚠️ API CHECKS REPORTED PROBLEMS — see the publish log before doing anything else.'
            fi
            TEXT=$(printf '✅ *Posted:* %s\n\n%s\n\n❗ *Step 0 — CONFIRM IT IS VISIBLE.* Open the link. If it says "Post cannot be displayed" or is missing from Page posts, it is NOT live (this happened to July 2026 despite every API check passing). Stop and investigate before the steps below.\n\nThen, two manual steps (Dev-Tier cannot do these):\n1️⃣ Paste this as the FIRST COMMENT:\n%s\n\n2️⃣ Reshare from your personal profile for reach.' "$POST_URL" "$VLINE" "$COMMENT")
          fi
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_ADMIN_CHAT_ID" \
            --data-urlencode "text=$TEXT" \
            --data-urlencode "parse_mode=Markdown" >/dev/null

      # Skips the window refusal, which sends its own (accurate) message —
      # this one's "a re-run may double-post" is false there, and telling the
      # founder not to re-run is precisely the wrong instruction when a re-run
      # is the fix.
      - name: Telegram — publish failed
        if: failure() && env.WINDOW_BLOCKED != 'true' 
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ADMIN_CHAT_ID" ]; then exit 0; fi
          TEXT=$(printf '⚠️ Clone Watch publish FAILED after approval. Check the run before re-running (a re-run may double-post): %s' "$RUN_URL")
          curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_ADMIN_CHAT_ID" \
            --data-urlencode "text=$TEXT" >/dev/null
