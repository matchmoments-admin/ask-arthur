name: Scrape Threat Feeds

# Tiered cron — each tier matches the upstream's update cadence so we don't
# burn CI minutes on no-op fetches. RSS scrapers also send If-None-Match /
# If-Modified-Since via common/http_cache.py, so unchanged feeds short-circuit
# server-side too.
#
# THE TIER CONTRACT: a step's `if:` matches EXACTLY ONE schedule — its own.
# Until 2026-07-30 every tier also accepted every lower-cadence schedule (the
# tier-3h steps listed all four crons), so a tier-3h scraper ran on all 15 daily
# workflow runs instead of its own 8. Measured cost: 1,038 of 3,067 step-minutes
# over 29 days were literal re-runs — 33.8%, ~US$6.47/mo — confirmed twice, from
# 11,319 GitHub step records and independently from prod feed_ingestion_log,
# agreeing to 0.1%. The comments above each tier described the intended design
# all along; the conditions defeated it.
#
# Effective cadence after the fix: tier-3h 8 runs/day, tier-6h 4, tier-12h 2,
# tier-daily 1. If you add a step, give it ONE schedule. If you want a feed on
# two cadences, that is a signal it belongs in the faster tier, not a reason to
# list both.
#
# NOT consolidated into a single cron on purpose. Collapsing the four entries
# into `0 */3` plus in-job hour dispatch would save a further ~US$0.92/mo, but
# on a `0 */3` grid `date -u +%H` never equals 16, so the daily tier (ASIC,
# IPsum, AbuseIPDB, ACNC, PFRA) would silently stop while the workflow stayed
# green — the exact failure shape this file just had. Not worth US$0.92.
#
# Also do NOT add `concurrency: cancel-in-progress` here: only 64 of 414
# consecutive run pairs overlap, and each overlap is a different tier doing
# different work, so cancelling would kill legitimate runs. GitHub's median
# dispatch delay is ~114 min (p90 175), which is also why any runbook line
# claiming this workflow "runs at HH:MM" is off by one to four hours.
on:
  schedule:
    - cron: '0 */3 * * *'    # tier-3h: AU regulator narratives (latency-sensitive)
    - cron: '0 */6 * * *'    # tier-6h: high-velocity IOC feeds + Reddit
    - cron: '0 */12 * * *'   # tier-12h: bulk IOC mirrors
    - cron: '0 16 * * *'     # tier-daily: snapshots (02:00 AEST)
  workflow_dispatch:
    inputs:
      feed:
        description: 'Which feed to scrape (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - scamwatch_alerts
          - acsc_alerts
          - asic_investor_alerts
          - probe_acsc
          - urlhaus
          - openphish
          - phishtank
          - phishstats
          - phishing_database
          - phishing_army
          - feodo
          - ipsum
          - spamhaus
          - abuseipdb
          - crtsh
          - reddit
          - acnc_register
          - pfra_members
          - austrac

jobs:
  scrape:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCRAPER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: pipeline/scrapers
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pipeline/scrapers
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/scrapers/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ──────────────────────────────────────────────────────────────────
      # tier-3h — AU regulator narrative scrapers (highest priority)
      # ──────────────────────────────────────────────────────────────────
      - name: Scamwatch alerts (HTML narrative)
        if: |
          github.event.inputs.feed == 'all' || github.event.inputs.feed == 'scamwatch_alerts'
          || (github.event_name == 'schedule' && github.event.schedule == '0 */3 * * *')
        run: python -m scamwatch_alerts || echo "scamwatch_alerts" >> "$GITHUB_WORKSPACE/scraper_failures.txt"

      - name: ACSC alerts + advisories (RSS)
        if: |
          github.event.inputs.feed == 'all' || github.event.inputs.feed == 'acsc_alerts'
          || (github.event_name == 'schedule' && github.event.schedule == '0 */3 * * *')
        run: python -m acsc_alerts || echo "acsc_alerts" >> "$GITHUB_WORKSPACE/scraper_failures.txt"

      # One-shot diagnostic probe — workflow_dispatch only. Captures HTTP
      # status, timing, and headers across multiple UA/method permutations
      # so we can pinpoint exactly what cyber.gov.au is doing to GH-runner
      # IPs. See pipeline/scrapers/probe_acsc.py for the matrix.
      - name: Probe cyber.gov.au (diagnostic)
        if: github.event.inputs.feed == 'probe_acsc'
        run: python -m probe_acsc

      # ──────────────────────────────────────────────────────────────────
      # tier-6h — high-velocity IOC feeds + Reddit
      # ──────────────────────────────────────────────────────────────────
      - name: URLhaus
        if: |
          github.event.inputs.feed == 'all' || github.event.inputs.feed == 'urlhaus'
          || (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *')
        run: python -m urlhaus || echo "urlhaus" >> "$GITHUB_WORKSPACE/scraper_failures.txt"

      - name: OpenPhish
        if: |
          github.event.inputs.feed == 'all' || github.event.inputs.feed == 'openphish'
          || (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *')
        run: python -m openphish || echo "openphish" >> "$GITHUB_WORKSPACE/scraper_failures.txt"

      - name: PhishTank
        if: |
          github.event.inputs.feed == 'all' || github.event.inputs.feed == 'phishtank'
          || (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *')
        run: python -m phishtank || echo "phishtank" >> "$GITHUB_WORKSPACE/scraper_failures.txt"

      # ThreatFox — DISABLED 2026-05-11. abuse.ch API key returning 401
      # Unauthorized since 2026-02-23 (80+ days of error rows). Coverage
      # overlap with urlhaus/phishtank/openphish, so removing rather than
      # rotating. To re-enable: rotate THREATFOX_AUTH_KEY at
      # https://auth.abuse.ch, restore this step + the choice option above,
      # and revert pipeline/scrapers/threatfox.py if any drift accumulated.

      # ──────────────────────────────────────────────────────────────────
      # tier-12h — bulk IOC mirrors (high overlap with tier-6h, slower)
      # ──────────────────────────────────────────────────────────────────
      - name: PhishStats
        if: |
          github.event.inputs.feed == 'all' || github.event.inputs.feed == 'phishstats'
          || (github.event_name == 'schedule' && github.event.schedule == '0 */12 * * *')
        run: python -m phishstats || echo "phishstats" >> "$GITHUB_WORKSPACE/scraper_failures.txt"

      # Phishing.Database — DISABLED on the schedule 2026-07-30. 244 lifetime
      # runs, ALL status='success', records_fetched=0 on every one. Probed
      # 2026-07-30: the configured upstream returns HTTP 200 with a 1-byte body
      # (a bare newline), so raise_for_status() passes, the parse loop yields
      # nothing, and the status-downgrade guard never fires because it sits
      # inside the `if urls:` branch. It has contributed nothing while counting
      # toward the "16 threat feeds" headline. Kept manual-only for re-probing;
      # find a working upstream mirror before re-enabling.
      - name: Phishing.Database [manual-only — upstream returns a 1-byte body]
        if: github.event.inputs.feed == 'phishing_database'
        run: python -m phishing_database || echo "phishing_database" >> "$GITHUB_WORKSPACE/scraper_failures.txt"

      - name: Phishing Army
        if: |
          github.event.inputs.feed == 'all' || github.event.inputs.feed == 'phishing_army'
          || (github.event_name == 'schedule' && github.event.schedule == '0 */12 * * *')
        run: python -m phishing_army || echo "phishing_army" >> "$GITHUB_WORKSPACE/scraper_failures.txt"

      # Feodo + Spamhaus moved 12h → daily 2026-07-30. Both upstreams change far
      # more slowly than we were polling: feodo has produced 0 new rows in 82
      # days (its upstream list is a static 5 entries) and spamhaus 14 new rows
      # in 30 days. Daily is still ahead of either upstream's real cadence.
      - name: Feodo Tracker
        if: |
          github.event.inputs.feed == 'all' || github.event.inputs.feed == 'feodo'
          || (github.event_name == 'schedule' && github.event.schedule == '0 16 * * *')
        run: python -m feodo || echo "feodo" >> "$GITHUB_WORKSPACE/scraper_failures.txt"

      - name: Spamhaus DROP/EDROP
        if: |
          github.event.inputs.feed == 'all' || github.event.inputs.feed == 'spamhaus'
          || (github.event_name == 'schedule' && github.event.schedule == '0 16 * * *')
        run: python -m spamhaus || echo "spamhaus" >> "$GITHUB_WORKSPACE/scraper_failures.txt"

      # ──────────────────────────────────────────────────────────────────
      # tier-daily — snapshots and lower-velocity sources (02:00 AEST)
      # ──────────────────────────────────────────────────────────────────
      - name: ASIC Investor Alert List (JSON snapshot)
        if: |
          github.event.inputs.feed == 'all' || github.event.inputs.feed == 'asic_investor_alerts'
          || (github.event_name == 'schedule' && github.event.schedule == '0 16 * * *')
        run: python -m asic_investor_alerts || echo "asic_investor_alerts" >> "$GITHUB_WORKSPACE/scraper_failures.txt"

      # AUSTRAC media releases — RSS (PR-B3 v131). Money-mule + payments-fraud
      # typology reports. Low-volume (~1-3 releases/week).
      #
      # DISABLED on the schedule (and from feed=='all') 2026-06-29: AUSTRAC sits
      # behind Akamai, which blocks GitHub Actions' datacenter IPs regardless of
      # User-Agent — the request is dropped at the edge, so the conditional_get
      # Mozilla-UA fallback can't recover and the scraper tripped its circuit
      # breaker (3 consecutive failures → Telegram page). The feed itself is
      # healthy (the RSS URL returns 200 to a browser UA from a normal IP), so
      # this is an egress-IP block, not a dead feed — re-enabling would need a
      # residential/proxy egress, not worth it for a low-value feed. Kept as a
      # manual-only step so `gh workflow run scrape-feeds.yml -f feed=austrac`
      # still works for re-probing; flip the condition back to re-enable daily.
      - name: AUSTRAC media releases (RSS narrative) [manual-only — Akamai blocks CI IPs]
        if: github.event.inputs.feed == 'austrac'
        run: python -m austrac || echo "austrac" >> "$GITHUB_WORKSPACE/scraper_failures.txt"

      - name: IPsum
        if: |
          github.event.inputs.feed == 'all' || github.event.inputs.feed == 'ipsum'
          || (github.event_name == 'schedule' && github.event.schedule == '0 16 * * *')
        run: python -m ipsum || echo "ipsum" >> "$GITHUB_WORKSPACE/scraper_failures.txt"

      - name: AbuseIPDB seed
        if: |
          github.event.inputs.feed == 'all' || github.event.inputs.feed == 'abuseipdb'
          || (github.event_name == 'schedule' && github.event.schedule == '0 16 * * *')
        env:
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
        run: python -m abuseipdb || echo "abuseipdb" >> "$GITHUB_WORKSPACE/scraper_failures.txt"

      # CryptoScamDB — DISABLED 2026-05-11. Source repo returns 404 at
      # raw.githubusercontent.com (project archived/moved). To re-enable:
      # update SOURCE_URL in pipeline/scrapers/cryptoscamdb.py to a working
      # mirror, then restore this step + the choice option above.

      # crt.sh — RETIRED from the schedule 2026-07-30, on the second attempt.
      #
      # It discovers nothing: 29/29 runs succeeded and fetched 31,584
      # certificates, but records_new was 0 on every one, and threat_intel_urls
      # confirms it independently — max(first_reported_at) 2026-06-05, i.e. 55
      # days without a new row. At 13.6 min/run it was the slowest step here,
      # 284 of 3,067 step-minutes over 29 days (~US$1.77/mo) for zero output.
      #
      # The FIRST attempt to retire it was reverted the same day, because its
      # daily last_seen_in_feed touch was load-bearing: mark_stale_urls would
      # have deactivated 1,726 crtsh-only URLs within 7 days, and is_active=TRUE
      # gates /api/scam-urls/lookup, /api/v1/threats/domains and
      # /api/v1/threats/urls/trending — so AU brand lookalikes (mygov,
      # centrelink, ato.gov, auspost, commbank, nab, anz, westpac, telstra, nbn,
      # optus, woolworths, coles) would have silently dropped out of the
      # blocklist the extension and B2B API read.
      #
      # migration-v262 fixes that properly: feed_sources.staleness_exempt marks
      # crtsh as carrying a HISTORICAL signal ("a lookalike certificate was
      # issued" does not stop being true), so mark_stale_urls no longer expires
      # rows whose only source is crtsh. Verified on prod before retiring —
      # exempt_feeds=['crtsh'], 1,726 rows protected, 252,886 unaffected, 0 crtsh
      # rows still sweepable. Only now is the scraper genuinely redundant.
      #
      # ADR-0016's 2026-07-17 amendment already found the CT mechanism dead for
      # discovery; this closes the retention half. crt.sh is ALSO used at runtime
      # by packages/scam-engine/src/ct-lookup.ts — a separate live path,
      # unaffected. Kept dispatchable via `-f feed=crtsh` for re-probing.
      - name: crt.sh [retired — 0 new rows since 2026-06-05; findings preserved by v262 exemption]
        if: github.event.inputs.feed == 'crtsh'
        run: python -m crtsh || echo "crtsh" >> "$GITHUB_WORKSPACE/scraper_failures.txt"

      # ACNC Charity Register mirror — gated independently of ENABLE_SCRAPER.
      - name: Scrape ACNC Charity Register
        if: |
          (github.event.inputs.feed == 'all' || github.event.inputs.feed == 'acnc_register'
           || (github.event_name == 'schedule' && github.event.schedule == '0 16 * * *'))
          && vars.ENABLE_CHARITY_CHECK_INGEST == 'true'
        env:
          FF_CHARITY_CHECK_INGEST: 'true'
        run: python -m acnc_register || echo "acnc_register" >> "$GITHUB_WORKSPACE/scraper_failures.txt"

      # PFRA member registry — quarterly upstream, daily probe is mostly no-op.
      - name: Scrape PFRA member registry
        if: |
          (github.event.inputs.feed == 'all' || github.event.inputs.feed == 'pfra_members'
           || (github.event_name == 'schedule' && github.event.schedule == '0 16 * * *'))
          && vars.ENABLE_CHARITY_CHECK_INGEST == 'true'
        env:
          FF_CHARITY_CHECK_INGEST: 'true'
        run: python -m pfra_members || echo "pfra_members" >> "$GITHUB_WORKSPACE/scraper_failures.txt"

      # Reddit — 6h tier only (00/06/12/18 UTC). Previously also matched the
      # daily 0-16 cron, which added a 5th run/day for no cadence benefit.
      - name: Scrape Reddit r/Scams
        if: |
          github.event.inputs.feed == 'all' || github.event.inputs.feed == 'reddit'
          || (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *')
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python -m reddit_scams || echo "reddit_scams" >> "$GITHUB_WORKSPACE/scraper_failures.txt"

      # Fail the job (→ notify-failure) if ANY scraper exited non-zero. Each
      # scraper step above captures its failure into scraper_failures.txt via
      # `|| echo` instead of failing inline, so a single feed's error no longer
      # aborts the remaining sequential steps (the pre-#564 cascade). This gate
      # restores the "page on real failure" intent of #556/#564 while preserving
      # full ingestion coverage on every run.
      - name: Fail if any scraper errored
        if: always()
        run: |
          if [ -s "$GITHUB_WORKSPACE/scraper_failures.txt" ]; then
            echo "Scrapers that exited non-zero this run:"
            cat "$GITHUB_WORKSPACE/scraper_failures.txt"
            exit 1
          fi
          echo "All scrapers completed without a hard error."

  notify-failure:
    needs: scrape
    # `failure()` catches a real feed error (the final gate step exits 1).
    # `cancelled()` catches a timed-out (90-min cap) or manually-cancelled run —
    # there the `if: always()` gate is SKIPPED, so failures already recorded in
    # scraper_failures.txt would otherwise go un-paged. Page on both.
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    steps:
      # Was a Slack incoming webhook read from `vars.SLACK_WEBHOOK_URL`. Moved to
      # Telegram 2026-07-30: a repo *variable* is not masked, so on a public repo
      # this step printed the webhook URL verbatim into its own log on every
      # firing — exposed from 2026-03-20 and still live when found. TELEGRAM_*
      # are secrets and are masked, and this is the channel the 8 cron alerters
      # already page to.
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TRIGGER: ${{ github.event_name }} (${{ github.event.schedule || github.event.inputs.feed || 'manual' }})
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_ADMIN_CHAT_ID:-}" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN / TELEGRAM_ADMIN_CHAT_ID not set — this failure reached nobody"
            exit 1
          fi
          TEXT=$(printf '🚨 Threat feed scraper failed\nTrigger: %s\nRun: %s' "$TRIGGER" "$RUN_URL")
          if ! curl -sf -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
              --data-urlencode "text=${TEXT}" \
              -o /dev/null; then
            echo "::error::Telegram send failed — the scraper failure was not delivered"
            exit 1
          fi
          echo "Telegram notification delivered."
