name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  TURBO_RUN_SUMMARY: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  ci:
    name: Lint • Typecheck • Test • Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          # Required for `--filter="...[origin/<base>]"` to resolve the diff base.
          fetch-depth: 0

      # Fast static guard (Tier 3 item 12): no two migration files may claim
      # one version number — the v261/v264 collision class. Seconds, no deps.
      - name: Check migration numbering
        run: ./scripts/check-migration-numbers.sh

      - uses: pnpm/action-setup@v4
        # Version is read from the `packageManager` field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint / Typecheck / Test / Build (PR — affected only)
        if: github.event_name == 'pull_request'
        run: |
          pnpm turbo run lint typecheck test build //#boundaries \
            --filter="...[origin/${{ github.base_ref }}]" \
            --summarize

      - name: Lint / Typecheck / Test / Build (main — full, warms cache)
        if: github.event_name == 'push'
        run: pnpm turbo run lint typecheck test build //#boundaries --summarize

      - name: Upload turbo run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-run-summary-${{ github.run_id }}
          path: .turbo/runs/
          if-no-files-found: ignore
          retention-days: 7

  pipeline-test:
    name: Python scraper tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.draft == false

    # This job ALWAYS reports, but only does work when pipeline/ changed.
    #
    # Why not a separate workflow with `paths: ['pipeline/**']`: a paths-filtered
    # workflow does not report at all on non-matching commits, and a required
    # status check that never reports leaves every merge stuck pending. Since
    # making these checks required is the planned next step, the filter has to
    # live inside a job that always produces a conclusion.
    #
    # Measured 2026-07-30: 475 of 475 CI runs ran this job, 480 billable minutes
    # over 29 days, while only 6 of 212 main-push commits (2.83%) touched
    # pipeline/. ~US$2.90/mo.
    #
    # The filter FAILS SAFE — any trouble computing the diff runs the tests.
    # Skipping a test suite by accident is the failure mode worth avoiding here.
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to resolve the base ref for the diff below.
          fetch-depth: 0

      - name: Detect pipeline/ changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail
          RANGE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="origin/${BASE_REF}...HEAD"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${BEFORE_SHA}..HEAD"
          fi

          if [ -z "$RANGE" ]; then
            echo "::warning::no usable diff range for $EVENT_NAME — running tests"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! CHANGED=$(git diff --name-only "$RANGE" 2>/dev/null); then
            echo "::warning::could not diff $RANGE — running tests"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Also run when this workflow itself changes, so a bad filter can't
          # merge without the suite it gates having executed once.
          if printf '%s\n' "$CHANGED" | grep -qE '^(pipeline/|\.github/workflows/ci\.yml$)'; then
            echo "pipeline/ touched — running tests"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "no pipeline/ changes in $RANGE — skipping the suite"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.filter.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/scrapers/requirements.txt

      - name: Install dependencies
        if: steps.filter.outputs.run == 'true'
        run: pip install -r pipeline/scrapers/requirements.txt

      - name: Run pipeline tests
        if: steps.filter.outputs.run == 'true'
        working-directory: pipeline/scrapers
        run: python -m pytest tests/ -v

      - name: Run investigation parser tests
        if: steps.filter.outputs.run == 'true'
        working-directory: pipeline
        # Install the package's own deps (incl. pytest) rather than relying on
        # the scrapers job incidentally pulling pytest into the same runner.
        run: |
          pip install -r investigation/requirements.txt
          python -m pytest investigation/ -v
