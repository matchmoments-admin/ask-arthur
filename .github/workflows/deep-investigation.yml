name: Deep Investigation Scan

on:
  schedule:
    # Sunday 2am UTC (after scrape-feeds at midnight)
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      entity_type:
        description: 'Entity type to investigate (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ip
          - domain
          - url
      risk_threshold:
        description: 'Minimum risk level to investigate'
        required: true
        default: 'HIGH'
        type: choice
        options:
          - CRITICAL
          - HIGH

jobs:
  investigate:
    # Set ENABLE_DEEP_INVESTIGATION to "true" in GitHub repo variables to allow scheduled runs.
    # Manual workflow_dispatch always runs regardless of this setting.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_DEEP_INVESTIGATION == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        # Run from pipeline/ so `python -m investigation` resolves the package
        # (investigate.py uses a relative import `from .investigate import ...`,
        # which fails when invoked from INSIDE pipeline/investigation/). Every
        # scheduled run had died here with "No module named investigation"
        # since the workflow was created (Feb 2026) — whois never actually ran.
        working-directory: pipeline

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pipeline/investigation

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/investigation/requirements.txt

      - name: Install Python dependencies
        # working-directory is pipeline/, so point at the package's requirements.
        run: pip install -r investigation/requirements.txt

      - name: Install investigation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap dnsrecon nikto whatweb sslscan whois curl

      - name: Run deep investigation
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python -m investigation \
            --type "${{ github.event.inputs.entity_type || 'all' }}" \
            --risk-threshold "${{ github.event.inputs.risk_threshold || 'HIGH' }}" \
            --limit 50

  # ---------------------------------------------------------------------
  # Notify on failure — added 2026-07-30.
  #
  # This workflow had NO notify job of any kind, unlike both scraper
  # workflows. The consequence, measured: 20 consecutive scheduled runs
  # failed from 2026-03-01 to 2026-07-12 — 138 days, the entire lifetime of
  # the import bug documented in the `working-directory` comment above — and
  # reached no channel. It was found by manual review, not by an alert.
  #
  # This is the clearest evidence in the repo that a red run does not reach a
  # human unless the workflow explicitly pages. Any new scheduled workflow
  # needs one of these.
  # ---------------------------------------------------------------------
  notify-failure:
    needs: investigate
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          TRIGGER: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_ADMIN_CHAT_ID:-}" ]; then
            echo "::error::TELEGRAM_* secrets not set — this failure reached nobody"
            exit 1
          fi
          TEXT=$(printf '🔍 Deep investigation scan failed\nTrigger: %s\nRun: %s' "$TRIGGER" "$RUN_URL")
          if ! curl -sf -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
              --data-urlencode "text=${TEXT}" \
              -o /dev/null; then
            echo "::error::Telegram send failed — the investigation failure was not delivered"
            exit 1
          fi
          echo "Telegram notification delivered."
